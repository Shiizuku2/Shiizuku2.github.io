<title>しずくのリンク</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Outfit:wght@400;500&display=swap">
<style>
/* 配置：粘土の地面がそのままページ。文字は地面に直接書き、家のまわりに吹き出しが4つ浮かぶ */
:root {
  /* 色は絵から取った（地面の明るいところ・暗いところ、題名の文字の茶） */
  --ground-light: #f5ecdd;
  --ground: #efe0cc;
  --ground-deep: #e7d0b7;
  --ink: #5f4530;        /* 本文。地の上で読める濃さ */
  --ink-soft: #8b6b47;   /* 絵の中の題名と同じ茶 */
  --clay-light: #fdf6ea;
  --clay: #f1e3d0;
  --clay-edge: #e5d2b9;

  --display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --label: "Outfit", "Helvetica Neue", Arial, sans-serif;
}
/*
 * FocusTimer はアイボリー1色で作っている（暗い配色はやめた。DR-025）。
 * このページは絵の地面そのものなので、同じく1色。色はすべてここで決める。
 */

* { box-sizing: border-box; }

body {
  min-height: 100vh;
  background:
    radial-gradient(130% 95% at 20% 6%,
      var(--ground-light) 0%,
      var(--ground) 40%,
      var(--ground-deep) 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--display);
  font-size: 15px;
  line-height: 1.9;
}

.wrap {
  max-width: 520px;
  margin: 0 auto;
  padding-block: 52px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ---- 地面に直接書く文字 ---- */
.name {
  margin: 0;
  text-align: center;
  font-weight: 500;
  font-size: clamp(34px, 11vw, 44px);
  line-height: 1.25;
  letter-spacing: 0.22em;
  padding-left: 0.22em;
  color: var(--ink-soft);
}

.sub {
  margin: 10px 0 0;
  text-align: center;
  font-family: var(--label);
  font-size: clamp(13px, 3.6vw, 15px);
  font-weight: 400;
  letter-spacing: 0.16em;
  color: var(--ink-soft);
}

/* 名前の下の猫。四角く切り出して、角を丸めて貼る */
.cat {
  display: block;
  width: 152px;
  max-width: 46%;
  margin: 18px auto 0;
  border-radius: 22px;
}

.role {
  margin: 20px auto 0;
  /* 「担当」が行をまたいで切れないよう、少し狭くして折り返す場所を決める */
  max-width: 15.5em;
  text-align: center;
  font-size: 14px;
  line-height: 2;
  color: var(--ink);
}

/* ---- 家と吹き出しの場 ---- */
.scene {
  position: relative;
  width: 100%;
  margin-top: 30px;
  aspect-ratio: 5 / 7.3;
}

.house {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 48%;
  transform: translateX(-50%);
}

/* ---- 吹き出し（押すと開く） ---- */
.bubble {
  position: absolute;
  width: 148px;
  min-height: 114px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 14px 12px;
  text-align: center;
  text-decoration: none;
  color: var(--ink);
  border-radius: 54% 46% 52% 48% / 52% 54% 46% 48%;
  background: radial-gradient(72% 72% at 34% 26%, var(--clay-light) 0%, var(--clay) 56%, var(--clay-edge) 100%);
  box-shadow:
    0 14px 24px rgba(120, 85, 55, 0.13),
    inset 0 -9px 15px rgba(150, 110, 75, 0.10),
    inset 0 9px 13px rgba(255, 252, 245, 0.8);
  transition: transform 0.25s ease;
  animation: float 7s ease-in-out infinite;
}

.bubble:hover { transform: translateY(-4px); }

.bubble .n {
  font-family: var(--label);
  font-size: 15.5px;
  font-weight: 500;
  letter-spacing: 0.1em;
  color: var(--ink);
}

.bubble .d {
  font-size: 11.5px;
  line-height: 1.5;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
}

/* 吹き出しから家へ続く小さな玉 */
.bubble i {
  position: absolute;
  display: block;
  border-radius: 50%;
  background: radial-gradient(70% 70% at 34% 28%, var(--clay-light) 0%, var(--clay) 60%, var(--clay-edge) 100%);
  box-shadow: 0 6px 10px rgba(120, 85, 55, 0.12), inset 0 4px 7px rgba(255, 252, 245, 0.8);
}

.bubble .d1 { width: 19px; height: 19px; bottom: -13px; }
.bubble .d2 { width: 11px; height: 11px; bottom: -31px; }
.bubble--l .d1 { right: 10px; }
.bubble--l .d2 { right: -4px; }
.bubble--r .d1 { left: 10px; }
.bubble--r .d2 { left: -4px; }

/* 上から下へ、左・右・左・右のジグザグ */
.b1 { left: 0; top: 0; }
.b2 { right: 0; top: 15%; animation-delay: -1.8s; }
.b3 { left: 0; top: 30%; animation-delay: -3.6s; }
.b4 { right: 0; top: 45%; animation-delay: -5.4s; }

@keyframes float {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -7px; }
}

a:focus-visible {
  outline: 2px solid var(--ink-soft);
  outline-offset: 4px;
}

footer {
  margin-top: 34px;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--ink-soft);
}

@media (prefers-reduced-motion: reduce) {
  .bubble { animation: none; transition: none; }
  .bubble:hover { transform: none; }
}
</style>
